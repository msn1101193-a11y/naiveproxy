name: Build only Windows x64 v109

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash
    working-directory: src

env:
  CACHE_EPOCH: 1
  SCCACHE_CACHE_SIZE: 200M
  BUILD_TAG: v109.0.5414.74-2
  BUNDLE: naiveproxy-v109.0.5414.74-2-win-x64
  EXTRA_FLAGS: 'target_cpu="x64"'

jobs:
  win-x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v109.0.5414.74-2

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: toolchains-win-x64-v109

      - name: Cache PGO win64
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/chrome-win64-*
          key: pgo-win64-v109

      - id: sccache-timestamp
        run: echo "SCCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT

      - name: Cache sccache files
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: sccache-win-x64-v109-${{ steps.sccache-timestamp.outputs.SCCACHE_TIMESTAMP }}
          restore-keys: sccache-win-x64-v109-

      - name: Install ninja if missing
        run: |
          mkdir -p ~/bin
          if [ ! -f ~/bin/ninja.exe ]; then
            curl -LO https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip
            unzip -o ninja-win.zip -d ~/bin
          fi

      - name: Get clang
        run: ./get-clang.sh

      - name: Alias installed Windows SDK as 10.0.20348.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $kits = "C:\Program Files (x86)\Windows Kits\10"
          $need = "10.0.20348.0"

          foreach ($sub in @("Include", "Lib", "bin")) {
            $root = Join-Path $kits $sub
            if (!(Test-Path $root)) {
              Write-Host "SKIP missing root $root"
              continue
            }

            $targetDir = Get-ChildItem $root -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1

            if (!$targetDir) {
              throw "No SDK version directory found in $root"
            }

            $dst = Join-Path $root $need
            if (!(Test-Path $dst)) {
              cmd /c mklink /J "$dst" "$($targetDir.FullName)"
            }

            if (!(Test-Path $dst)) {
              throw "Failed to create SDK alias $dst"
            }

            Write-Host "$sub alias: $dst -> $($targetDir.FullName)"
          }

          if (!(Test-Path "C:\Program Files (x86)\Windows Kits\10\Include\10.0.20348.0\um")) {
            throw "SDK alias include\um missing"
          }

          if (!(Test-Path "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.20348.0\um\x64")) {
            throw "SDK alias lib\um\x64 missing"
          }

      - name: Reset sccache stats
        run: ~/.cargo/bin/sccache -z || true

      - name: Build
        run: ./build.sh

      - name: Show sccache stats
        run: ~/.cargo/bin/sccache -s || true

      - name: Basic test
        run: ../tests/basic.sh out/Release/naive

      - name: Pack naiveproxy Windows x64
        run: |
          mkdir "$BUNDLE"
          if [ -f out/Release/naive.exe ]; then
            cp out/Release/naive.exe "$BUNDLE/naive.exe"
            openssl sha256 out/Release/naive.exe > sha256sum.txt
          else
            cp out/Release/naive "$BUNDLE/naive.exe"
            openssl sha256 out/Release/naive > sha256sum.txt
          fi
          cp config.json ../LICENSE ../USAGE.txt "$BUNDLE/"
          7z a "$BUNDLE.zip" "$BUNDLE"
          cat sha256sum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: naiveproxy-v109.0.5414.74-2-win-x64
          path: |
            src/naiveproxy-v109.0.5414.74-2-win-x64.zip
            src/sha256sum.txt

      - name: Upload to release
        run: gh release upload "$BUILD_TAG" "$BUNDLE.zip" --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
